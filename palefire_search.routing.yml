palefire_search.page:
  path: '/v2/search'
  defaults:
    _controller: '\Drupal\palefire_search\Controller\SearchController::page'
    _title_callback: '\Drupal\palefire_search\Controller\SearchController::title'
  requirements:
    _access: 'TRUE'

# One external source's section, loaded after the page so a slow or failing
# service can't hold the page up. Answers with an HTML fragment.
palefire_search.source:
  path: '/v2/search/source/{source}'
  defaults:
    _controller: '\Drupal\palefire_search\Controller\SearchController::source'
  requirements:
    _access: 'TRUE'
    source: '[a-z_]+'

# Where the listed Catalog records are held, loaded after them because it changes
# far more often than they do. Answers with an HTML fragment.
palefire_search.holdings:
  path: '/v2/search/holdings'
  defaults:
    _controller: '\Drupal\palefire_search\Controller\SearchController::holdings'
  requirements:
    _access: 'TRUE'

# One Catalog record's copy numbers, read from its page when its table is
# opened. Answers with JSON keyed by item ID.
palefire_search.copies:
  path: '/v2/search/copies'
  defaults:
    _controller: '\Drupal\palefire_search\Controller\SearchController::copies'
  requirements:
    _access: 'TRUE'
